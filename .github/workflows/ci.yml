name: checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check
      - run: nix develop -c zig fmt --check build.zig src
      - run: nix develop -c npm ci --ignore-scripts
      - run: nix develop -c npm run check
      - run: nix develop -c npm test
